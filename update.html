<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambah Donatur</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: #f8fafc;
    color: #1e293b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .box {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    border: 1px solid #f1f5f9;
  }

  h2 {
    text-align: center;
    color: #0f766e;
    margin-bottom: 24px;
    font-size: 22px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
    color: #475569;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }

  .save { background: #0d9488; color: white; }
  .back { background: #f1f5f9; color: #475569; }

  .info {
    margin-top: 20px;
    padding: 12px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="box">
  <h2>➕ Tambah Donatur Baru</h2>

  <div class="form-group">
    <label for="pass">Password Admin</label>
    <input type="password" id="pass" placeholder="Masukkan password admin">
  </div>

  <div class="form-group">
    <label for="nama">Nama Donatur</label>
    <input id="nama" placeholder="Contoh: Bp. Ahmad">
  </div>

  <div class="form-group">
    <label for="nominal">Nominal Donasi (Rp)</label>
    <input id="nominal" type="number" placeholder="Contoh: 100000">
  </div>

  <button class="save" id="btnSimpan" onclick="simpan()">Simpan Donasi</button>
  <button class="back" onclick="window.location.href='index.html'">Kembali ke Laporan</button>

  <div class="info">
    💡 Data akan langsung tersimpan disistem & tersinkron ke semua jamaah.
  </div>
</div>

<script>
// PASTE URL SCRIPT GOOGLE ANDA DI BAWAH INI
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJD4p9fIqLUTFVT89CvSgA3JznOhlaFv7_pTBg9YuG2skfhhLNEkkffSU_SCLHw4RM_A/exec";

async function simpan() {
  const pass = document.getElementById("pass").value;
  const nama = document.getElementById("nama").value.trim();
  const nominal = Number(document.getElementById("nominal").value);

  if (!pass || !nama || !nominal) {
    alert("Lengkapi semua field termasuk password!");
    return;
  }

  const btn = document.getElementById("btnSimpan");
  btn.disabled = true;
  btn.innerText = "⏳ Menyimpan ke Database...";

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "add",
        name: nama,
        amount: nominal,
        password: pass
      })
    });

    const data = await res.json();
    if (data.status === "success") {
      alert("Donatur berhasil ditambahkan!");
      window.location.href = "index.html";
    } else {
      alert("Gagal: " + data.message);
      btn.disabled = false;
      btn.innerText = "Simpan Donasi";
    }
  } catch (err) {
    alert("Terjadi kesalahan jaringan.");
    btn.disabled = false;
    btn.innerText = "Simpan Donasi";
  }
}
</script>

</body>
</html>
